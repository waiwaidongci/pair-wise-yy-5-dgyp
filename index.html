<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦四方连续接版与冻结复核台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 24px; }
    h2 { font-size: 17px; margin: 18px 0 8px; }
    h2:first-child { margin-top: 0; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #71675c; }
    button.ok { background: #355b38; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input, select { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 280px 1fr 340px; gap: 16px; padding: 16px; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 720px); border: 6px solid #72533c; background: #72533c; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: pointer; border-radius: 2px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch { aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; }
    .swatch.active { border-color: #1f1b16; }
    .blocks { display: grid; gap: 8px; }
    .blocks button.active { outline: 3px solid #1f1b16; }
    .unit-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
    .stats { display: grid; gap: 8px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e1d5c5; padding: 6px 0; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .warning { color: #a03a2e; font-weight: 800; }
    .tiling { display: grid; gap: 4px; margin-top: 8px; }
    .copy { display: grid; gap: 1px; border: 1px solid #72533c; background: #72533c; }
    .mini { aspect-ratio: 1; border-radius: 1px; }
    .verdict { margin-top: 10px; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
    .verdict.ok { background: #e6efe3; border: 1px solid #9dbf9a; }
    .verdict.fail { background: #f6e3df; border: 1px solid #d3a29a; }
    .verdict ul { margin: 6px 0 0; padding-left: 18px; }
    .card { border: 1px solid #d9cdbc; border-radius: 8px; padding: 10px 12px; margin-top: 8px; background: #fff; font-size: 14px; display: grid; gap: 6px; }
    .badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 800; }
    .badge.pending { background: #f3e2b3; color: #7a5b12; }
    .badge.frozen { background: #dfe7ef; color: #2d4a66; }
    .badge.stale { background: #f6e3df; color: #a03a2e; }
    .badge.valid { background: #e6efe3; color: #355b38; }
    .msg { margin-top: 8px; font-size: 14px; min-height: 20px; }
    .muted { color: #76695e; font-size: 13px; }
    @media (max-width: 1000px) { header { display: block; } .app { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>手工织锦四方连续接版与冻结复核台</h1>
      <div>由纹样排版台扩展：六乘六平铺预览、接版判定、复核冻结与版本存档。</div>
    </div>
    <div class="toolbar"><button id="saveBtn">保存方案</button><button id="exportBtn" class="secondary">导出JSON</button></div>
  </header>
  <main class="app">
    <aside class="panel">
      <h2>画布</h2>
      <label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36">
      <label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32">
      <button id="newBtn">新建网格</button>
      <label>制版人</label><input id="maker" type="text" placeholder="制版人姓名">
      <h2>色线库</h2>
      <div class="palette" id="palette"></div>
      <h2>基础纹样块</h2>
      <div class="blocks">
        <button data-block="dot" class="secondary">单点</button>
        <button data-block="cross" class="secondary">十字</button>
        <button data-block="diamond" class="secondary">小菱形</button>
      </div>
      <h2>重复单元</h2>
      <div class="unit-inputs">
        <div><label>起点列</label><input id="unitX" type="number" min="0" value="0"></div>
        <div><label>起点行</label><input id="unitY" type="number" min="0" value="0"></div>
        <div><label>单元宽</label><input id="unitW" type="number" min="1" value="6"></div>
        <div><label>单元高</label><input id="unitH" type="number" min="1" value="6"></div>
      </div>
    </aside>
    <section class="panel">
      <h2>纹样画布</h2>
      <div class="grid" id="grid"></div>
      <h2>四方连续平铺预览（6×6）</h2>
      <div id="tilePreview"></div>
      <div class="verdict" id="verdict"></div>
    </section>
    <aside class="panel">
      <h2>操作</h2>
      <div class="toolbar"><button id="undoBtn" class="secondary">撤销</button><button id="redoBtn" class="secondary">重做</button></div>
      <p class="muted">点击填色，按住拖动可连续填色。</p>
      <h2>用色统计</h2>
      <div class="stats" id="stats"></div>
      <h2>断线风险</h2>
      <div id="risk"></div>
      <h2>接版</h2>
      <button id="tileBtn">生成接版（判定通过后待复核）</button>
      <div class="msg" id="msg"></div>
      <div id="pending"></div>
      <h2>发布版存档</h2>
      <div id="releases"></div>
    </aside>
  </main>
  <script src="js/judge.js"></script>
  <script src="js/archive.js"></script>
  <script src="js/entry.js"></script>
</body>
</html>
